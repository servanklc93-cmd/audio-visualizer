<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VISUALIZER</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .ui {
            position: fixed;
            bottom: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .title {
            color: white;
            font-size: 0.7rem;
            letter-spacing: 6px;
            opacity: 0.5;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .upload-btn {
            padding: 12px 30px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            font-family: 'Courier New', monospace;
            font-size: 0.8rem;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 3px;
        }

        .upload-btn:hover {
            background: white;
            color: black;
        }

        .style-btn {
            padding: 10px 18px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.6);
            font-family: 'Courier New', monospace;
            font-size: 0.7rem;
            letter-spacing: 1px;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 3px;
        }

        .style-btn.active, .style-btn:hover {
            border-color: white;
            color: white;
        }

        .track-name {
            color: rgba(255,255,255,0.4);
            font-size: 0.7rem;
            letter-spacing: 2px;
        }

        #fileInput { display: none; }
    </style>
</head>
<body>

    <canvas id="canvas"></canvas>

    <div class="ui">
        <p class="track-name" id="trackName">MÜZİK DOSYASI SEÇ</p>
        <div class="controls">
            <button class="style-btn active" data-style="bars">BARS</button>
            <button class="style-btn" data-style="circle">CIRCLE</button>
            <button class="style-btn" data-style="wave">WAVE</button>
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                ▶ MÜZİK YÜKle
            </button>
        </div>
        <p class="title">AUDIO VISUALIZER</p>
    </div>

    <input type="file" id="fileInput" accept="audio/*">

    <script>
        const canvas = document.getElementById("canvas")
        const ctx = canvas.getContext("2d")
        const fileInput = document.getElementById("fileInput")
        const trackName = document.getElementById("trackName")

        canvas.width = window.innerWidth
        canvas.height = window.innerHeight

        window.addEventListener("resize", () => {
            canvas.width = window.innerWidth
            canvas.height = window.innerHeight
        })

        let audioCtx, analyser, source, dataArray, bufferLength
        let currentStyle = "bars"
        let hue = 0
        let isPlaying = false

        // Style buttons
        document.querySelectorAll(".style-btn").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".style-btn").forEach(b => b.classList.remove("active"))
                btn.classList.add("active")
                currentStyle = btn.dataset.style
            })
        })

        // File upload
        fileInput.addEventListener("change", (e) => {
            const file = e.target.files[0]
            if (!file) return

            trackName.textContent = file.name.replace(/\.[^/.]+$/, "").toUpperCase()

            if (audioCtx) audioCtx.close()

            audioCtx = new (window.AudioContext || window.webkitAudioContext)()
            analyser = audioCtx.createAnalyser()
            analyser.fftSize = 256
            bufferLength = analyser.frequencyBinCount
            dataArray = new Uint8Array(bufferLength)

            const reader = new FileReader()
            reader.onload = (ev) => {
                audioCtx.decodeAudioData(ev.target.result, (buffer) => {
                    if (source) source.disconnect()
                    source = audioCtx.createBufferSource()
                    source.buffer = buffer
                    source.connect(analyser)
                    analyser.connect(audioCtx.destination)
                    source.start(0)
                    isPlaying = true
                    animate()
                })
            }
            reader.readAsArrayBuffer(file)
        })

        function drawBars() {
            const w = canvas.width
            const h = canvas.height
            const barWidth = (w / bufferLength) * 2
            let x = 0

            for (let i = 0; i < bufferLength; i++) {
                const barHeight = (dataArray[i] / 255) * h * 0.8
                const r = Math.sin((hue + i * 2) * Math.PI / 180) * 127 + 128
                const g = Math.sin((hue + i * 2 + 120) * Math.PI / 180) * 127 + 128
                const b = Math.sin((hue + i * 2 + 240) * Math.PI / 180) * 127 + 128

                ctx.fillStyle = `rgb(${r},${g},${b})`
                ctx.fillRect(x, h - barHeight, barWidth - 1, barHeight)

                // Mirror top
                ctx.globalAlpha = 0.3
                ctx.fillRect(x, 0, barWidth - 1, barHeight * 0.3)
                ctx.globalAlpha = 1

                x += barWidth
            }
        }

        function drawCircle() {
            const cx = canvas.width / 2
            const cy = canvas.height / 2
            const radius = Math.min(canvas.width, canvas.height) * 0.2

            for (let i = 0; i < bufferLength; i++) {
                const angle = (i / bufferLength) * Math.PI * 2
                const amp = (dataArray[i] / 255) * radius * 1.5
                const x1 = cx + Math.cos(angle) * radius
                const y1 = cy + Math.sin(angle) * radius
                const x2 = cx + Math.cos(angle) * (radius + amp)
                const y2 = cy + Math.sin(angle) * (radius + amp)

                const r = Math.sin((hue + i * 3) * Math.PI / 180) * 127 + 128
                const g = Math.sin((hue + i * 3 + 120) * Math.PI / 180) * 127 + 128
                const b = Math.sin((hue + i * 3 + 240) * Math.PI / 180) * 127 + 128

                ctx.beginPath()
                ctx.moveTo(x1, y1)
                ctx.lineTo(x2, y2)
                ctx.strokeStyle = `rgb(${r},${g},${b})`
                ctx.lineWidth = 2
                ctx.stroke()
            }

            // Center circle
            const avg = dataArray.reduce((a, b) => a + b, 0) / bufferLength
            ctx.beginPath()
            ctx.arc(cx, cy, radius * 0.3 + avg * 0.2, 0, Math.PI * 2)
            ctx.strokeStyle = `hsla(${hue}, 100%, 70%, 0.5)`
            ctx.lineWidth = 2
            ctx.stroke()
        }

        function drawWave() {
            const w = canvas.width
            const h = canvas.height
            const sliceWidth = w / bufferLength
            let x = 0

            ctx.beginPath()
            ctx.moveTo(0, h / 2)

            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0
                const y = (v * h) / 2

                if (i === 0) ctx.moveTo(x, y)
                else ctx.lineTo(x, y)

                x += sliceWidth
            }

            ctx.lineTo(w, h / 2)

            const gradient = ctx.createLinearGradient(0, 0, w, 0)
            gradient.addColorStop(0, `hsl(${hue}, 100%, 60%)`)
            gradient.addColorStop(0.5, `hsl(${hue + 120}, 100%, 60%)`)
            gradient.addColorStop(1, `hsl(${hue + 240}, 100%, 60%)`)

            ctx.strokeStyle = gradient
            ctx.lineWidth = 3
            ctx.stroke()

            // Second wave mirror
            ctx.beginPath()
            x = 0
            for (let i = 0; i < bufferLength; i++) {
                const v = dataArray[i] / 128.0
                const y = h - (v * h) / 2
                if (i === 0) ctx.moveTo(x, y)
                else ctx.lineTo(x, y)
                x += sliceWidth
            }
            ctx.globalAlpha = 0.3
            ctx.stroke()
            ctx.globalAlpha = 1
        }

        function drawIdle() {
            const w = canvas.width
            const h = canvas.height
            const cx = w / 2
            const cy = h / 2

            ctx.beginPath()
            ctx.arc(cx, cy, 60, 0, Math.PI * 2)
            ctx.strokeStyle = `hsla(${hue}, 60%, 50%, 0.3)`
            ctx.lineWidth = 1
            ctx.stroke()

            ctx.fillStyle = `hsla(${hue}, 60%, 70%, 0.5)`
            ctx.font = "0.7rem 'Courier New'"
            ctx.textAlign = "center"
            ctx.fillText("MÜZİK YÜKLE", cx, cy + 5)
        }

        function animate() {
            requestAnimationFrame(animate)

            ctx.fillStyle = "rgba(0, 0, 0, 0.15)"
            ctx.fillRect(0, 0, canvas.width, canvas.height)

            hue = (hue + 0.5) % 360

            if (!isPlaying || !analyser) {
                drawIdle()
                return
            }

            analyser.getByteFrequencyData(dataArray)

            if (currentStyle === "bars") drawBars()
            else if (currentStyle === "circle") drawCircle()
            else if (currentStyle === "wave") drawWave()
        }

        animate()
    </script>

</body>
</html>
